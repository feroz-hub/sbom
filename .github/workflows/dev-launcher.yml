# Developer launcher (scripts/dev.py) unit tests on Windows, Linux and macOS.
#
# These tests mock every process, container and database operation. They run
# with --noconftest because tests/conftest.py connects to, migrates and
# truncates a PostgreSQL test database for every session. The SQLite URLs are a
# second guard: they make that conftest a no-op if it were ever loaded.
# Passing here is unit evidence only, not native full-stack acceptance.
name: dev-launcher

on:
  pull_request:
    paths:
      - "scripts/dev.py"
      - "scripts/dev_runtime.py"
      - "scripts/dev_greenfield.py"
      - "scripts/greenfield_https.py"
      - "scripts/greenfield_uuid.py"
      - "scripts/bootstrap.sh"
      - "scripts/bootstrap.ps1"
      - "tests/test_dev_launcher.py"
      - "tests/test_dev_lifecycle.py"
      - "tests/test_dev_greenfield.py"
      - "requirements.txt"
      - ".github/workflows/dev-launcher.yml"
      # Sources the launcher's drift-guard tests compare against.
      - "app/public_identity.py"
      - "app/workers/celery_app.py"
      - "docker-compose.server.yml"
      - "frontend/package-lock.json"
      - "alembic.ini"
      - "alembic/versions/**"
  push:
    paths:
      - "scripts/dev.py"
      - "scripts/dev_runtime.py"
      - "scripts/dev_greenfield.py"
      - "scripts/greenfield_https.py"
      - "scripts/greenfield_uuid.py"
      - "scripts/bootstrap.sh"
      - "scripts/bootstrap.ps1"
      - "tests/test_dev_launcher.py"
      - "tests/test_dev_lifecycle.py"
      - "tests/test_dev_greenfield.py"
      - "requirements.txt"
      - ".github/workflows/dev-launcher.yml"
      # Sources the launcher's drift-guard tests compare against.
      - "app/public_identity.py"
      - "app/workers/celery_app.py"
      - "docker-compose.server.yml"
      - "frontend/package-lock.json"
      - "alembic.ini"
      - "alembic/versions/**"

permissions:
  contents: read

jobs:
  launcher-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: sqlite:///unused-launcher-tests.db
      TEST_DATABASE_URL: sqlite:///unused-launcher-tests.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Launcher, lifecycle and Greenfield routing tests
        run: >-
          python -m pytest -p no:cacheprovider --noconftest -q
          tests/test_dev_launcher.py tests/test_dev_lifecycle.py tests/test_dev_greenfield.py
      - name: Bootstrap installer syntax (bash)
        if: runner.os != 'Windows'
        run: bash -n scripts/bootstrap.sh
      - name: Bootstrap installer parses in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\bootstrap.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors; exit 1 }
