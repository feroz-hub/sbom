# Unit/adapter regression tests only: no application database or provisioning.
# POSIX smoke tests below create disposable fixture-owned processes only.
# Passing this workflow is not Windows/macOS/Linux full-stack acceptance.
name: dev-launcher

on:
  pull_request:
    paths:
      - "scripts/dev.py"
      - "scripts/dev_*.py"
      - "scripts/dev_next_guard.cjs"
      - "scripts/greenfield*migration*.py"
      - "tests/test_dev*.py"
      - "tests/test_greenfield*.py"
      - "docs/engineering/dev-launcher*.md"
      - "requirements.txt"
      - ".github/workflows/dev-launcher.yml"
      - "app/public_identity.py"
      - "app/workers/celery_app.py"
      - "Dockerfile"
      - "docker-compose.server.yml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "alembic.ini"
      - "alembic/versions/**"
  push:
    paths:
      - "scripts/dev.py"
      - "scripts/dev_*.py"
      - "scripts/dev_next_guard.cjs"
      - "scripts/greenfield*migration*.py"
      - "tests/test_dev*.py"
      - "tests/test_greenfield*.py"
      - "docs/engineering/dev-launcher*.md"
      - "requirements.txt"
      - ".github/workflows/dev-launcher.yml"
      - "app/public_identity.py"
      - "app/workers/celery_app.py"
      - "Dockerfile"
      - "docker-compose.server.yml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "alembic.ini"
      - "alembic/versions/**"

permissions:
  contents: read

jobs:
  launcher-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_URL: "sqlite:///:memory:"
      TEST_DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Lint the launcher and controlled development configuration
        run: >-
          python -m ruff check scripts/dev.py scripts/dev_config.py scripts/dev_diagnostics.py
          scripts/dev_environment.py scripts/dev_prepared.py scripts/dev_private.py scripts/dev_setup.py
          scripts/dev_windows_acl.py tests/test_dev_windows_acl.py
          scripts/dev_components.py scripts/dev_frontend.py
          tests/test_dev_component_environments.py tests/test_dev_frontend_workspace.py
          tests/test_dev_compiler_probe.py tests/test_dev_frontend_next_integration.py
          tests/test_dev_next_guard.py tests/test_dev_native_compiler.py
          tests/test_dev_next_watch.py
          tests/test_dev_hmr_transport.py
          tests/test_dev_main_merge.py tests/test_dev_config.py tests/test_dev_diagnose.py
          tests/test_dev_prepared.py tests/test_dev_private_files.py tests/test_dev_setup.py
      - name: Compile without starting the launcher
        run: >-
          python -c "from pathlib import Path;
          [compile(Path(name).read_text(encoding='utf-8'), name, 'exec')
          for name in ('scripts/dev.py', 'scripts/dev_config.py', 'scripts/dev_diagnostics.py',
          'scripts/dev_environment.py', 'scripts/dev_prepared.py', 'scripts/dev_private.py', 'scripts/dev_setup.py', 'scripts/dev_windows_acl.py', 'scripts/dev_components.py', 'scripts/dev_frontend.py')]"
      - name: Cross-platform unit and mocked adapter regressions
        run: >-
          python -m pytest -p no:cacheprovider --noconftest -q
          tests/test_dev_config.py tests/test_dev_diagnose.py
          tests/test_dev_prepared.py tests/test_dev_private_files.py tests/test_dev_setup.py
          tests/test_dev_windows_acl.py
          tests/test_dev_component_environments.py tests/test_dev_frontend_workspace.py
          tests/test_dev_compiler_probe.py
          tests/test_dev_next_guard.py tests/test_dev_native_compiler.py
          tests/test_dev_next_watch.py
          tests/test_dev_hmr_transport.py
          tests/test_dev_launcher.py tests/test_dev_lifecycle.py
          tests/test_dev_windows_lifecycle.py tests/test_dev_windows_shutdown.py
          tests/test_dev_background.py tests/test_dev_main_merge.py
          tests/test_greenfield_windows_compat.py
      - name: POSIX TLS, setup and migration guard unit regressions
        if: runner.os != 'Windows'
        run: >-
          python -m pytest -p no:cacheprovider --noconftest -q
          tests/test_dev_cleanup.py tests/test_dev_consolidation.py
          tests/test_dev_greenfield.py tests/test_greenfield_https.py
          tests/test_greenfield_service_ports.py tests/test_dev_private_setup.py
          tests/test_greenfield_startup_migrations.py tests/test_greenfield_auto_migrations.py
          tests/test_greenfield_resource_startup.py tests/test_greenfield_governance_startup.py
      - name: Native process smoke fixtures (not full stack)
        run: >-
          python -m pytest -p no:cacheprovider --noconftest -q
          tests/test_dev_native_process.py
      - name: Optional real frontend HTTPS and HMR fixture (preinstalled packages only)
        run: >-
          python -m pytest -p no:cacheprovider --noconftest -q
          tests/test_dev_frontend_next_integration.py

  frontend-fixture:
    # Explicit installations are confined to fresh CI runners. The fixture
    # blocks Next compiler downloads and never starts the application stack.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26.1.0"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DATABASE_URL: "sqlite:///:memory:"
      TEST_DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install disposable fixture prerequisites
        run: |
          node --check scripts/dev_next_guard.cjs
          python -m pip install pytest pytest-timeout cryptography python-dotenv
          npm ci --ignore-scripts --prefix frontend
      - name: Real frontend TLS, HMR, environment and owned-cleanup acceptance
        run: >-
          python -m pytest -p pytest_timeout -p no:cacheprovider --noconftest
          --basetemp "${{ runner.temp }}/sbom-next-fixture" -q
          tests/test_dev_native_compiler.py tests/test_dev_frontend_next_integration.py
