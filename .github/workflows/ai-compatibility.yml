name: ai-compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/ai/**'
      - 'app/routers/ai_*.py'
      - 'app/services/validation_repair_service.py'
      - 'frontend/**'
      - 'tests/ai/**'
      - 'tests/test_tenant_isolation.py'
      - 'tests/test_security_remediation_patches.py'
      - '.github/workflows/ai-compatibility.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sbom
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: sbom_ai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sbom -d sbom_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      DATABASE_URL: postgresql+psycopg://sbom:synthetic-ci-only@127.0.0.1:5432/sbom_ai_test
      TEST_DATABASE_URL: postgresql+psycopg://sbom:synthetic-ci-only@127.0.0.1:5432/sbom_ai_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt ruff
      - name: AI, tenant and authorization regressions (mocked providers)
        run: python -m pytest tests/ai tests/test_tenant_isolation.py tests/test_security_remediation_patches.py -q
      - name: AI lint and whitespace
        run: |
          python -m ruff check app/ai app/routers/ai_credentials.py app/routers/ai_fixes.py app/services/validation_repair_service.py tests/ai scripts/run_ai_remediation_e2e.py
          git diff --check HEAD^ HEAD

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Remediation, permissions and verification states
        run: npx vitest run src/components/ai-fixes/__tests__ src/components/ai-fixes/GlobalAiBatchProgress/data-sync.integration.test.tsx src/components/ui/PermissionButton.test.tsx src/components/settings/ai/__tests__/ProviderModels.test.tsx src/lib/aiVerification.modern.test.ts --maxWorkers=1
