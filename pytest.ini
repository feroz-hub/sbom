[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:fastapi.*
# ``integration`` and ``bench`` are opt-in: they are slow by design and the
# 1,000-finding batch load test (tests/ai/test_batch_load.py) opens 32
# concurrent sessions and can wedge on connection-pool contention, taking the
# whole run with it. Its own docstring says "so CI can opt in / out" — but
# nothing deselected it, so a bare ``pytest`` ran it anyway and hung.
# Run them explicitly with ``pytest -m integration`` / ``-m bench``.
addopts = -ra --strict-markers -m "not integration and not bench"

# Safety net: no single test may hang the run. A hang becomes a failure with
# a traceback naming the test, instead of an unbounded wait that has to be
# diagnosed from pg_stat_activity. Generous enough for the slowest legitimate
# test here (the VEX suites take ~3-5 minutes in total, not per test).
timeout = 300
timeout_method = thread
markers =
    snapshot: regression snapshot tests that lock the JSON contract of an endpoint
    security: validation security / attack-fixture tests (must run < 100 ms each)
    bench: performance benchmarks (pytest-benchmark; run with -m bench)
    integration: full-pipeline tests against vendored fixtures
    property: property-based (Hypothesis) tests
    metric_consistency: cross-surface dashboard-metric reconciliation tests (gate on every PR)
    postgres: integration tests requiring TEST_POSTGRES_DATABASE_URL
