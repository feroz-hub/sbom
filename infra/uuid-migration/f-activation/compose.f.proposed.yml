# OFFLINE PROPOSAL. No provisioning/credential/egress approval is implied.
name: sbom-uuid-w2-f
services:
  postgres_f:
    image: ${F_POSTGRES_IMAGE:?Approve an existing local PG16.15 image ID; no pull/build}
    pull_policy: never
    restart: "no"
    cpus: 1.0
    mem_limit: 512m
    shm_size: 64m
    pids_limit: 128
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: uuid_w2_f_fresh
      POSTGRES_USER: uuid_w2_f_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/f_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - max_connections=12
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - statement_timeout=30s
      - -c
      - lock_timeout=1s
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:56043:5432"
    volumes:
      - f_pgdata:/var/lib/postgresql/data
    secrets:
      - source: f_password
        target: f_password
    networks:
      - f_access
    labels:
      sbom.uuid.target: F
      sbom.uuid.purpose: fresh-install-rehearsal
    healthcheck:
      # Readiness only; not authentication/identity/acceptance evidence.
      test: [CMD, pg_isready, -q, -h, "127.0.0.1", -p, "5432", -U, uuid_w2_f_bootstrap, -d, uuid_w2_f_fresh]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
volumes:
  f_pgdata:
    name: sbom-uuid-w2-f_f_pgdata
    labels:
      sbom.uuid.target: F
networks:
  f_access:
    name: sbom-uuid-w2-f_f_access
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    labels:
      sbom.uuid.target: F
secrets:
  f_password:
    file: /Users/ferozebasha/.sbom-uuid-w2-f/postgres-password
